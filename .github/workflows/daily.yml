name: daily

on:
  schedule:
    # 05:00 IST — ~80 min after the ~03:40 IST reading, leaving room for the
    # site to publish. GitHub cron is best-effort and may run late; that is
    # fine, the file only needs to exist before readers wake up.
    - cron: '30 23 * * *'
    # 11:00 IST retry. Observed lag on the primary schedule has run 5-7 hours
    # late, well past GitHub's usual 30-60 min slip. fetch-today.js writes no
    # per-run timestamp, so if the first run already succeeded this reproduces
    # the same file byte-for-byte and the commit step's `git diff --staged
    # --quiet` guard makes it a true no-op; a skipped day is not harmless,
    # since nothing backfills it.
    - cron: '30 05 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 152 MB unpacked. Installed here, never committed.
      - name: Install pinned corpus
        run: npm install --no-save @shabados/database@4.8.7

      - name: Fetch and resolve
        env:
          SHABADOS_DB: node_modules/@shabados/database/build/database.sqlite
          SHABADOS_VERSION: 4.8.7
        run: node bin/fetch-today.js

      - name: Commit
        run: |
          git config user.name  "hukamnama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(archive): $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
